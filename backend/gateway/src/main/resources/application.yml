server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:8081"
              - "${FRONTEND_ORIGIN:}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: auth-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs

        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/delivery/**
          filters:
            - StripPrefix=0

        - id: delivery-docs
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/delivery
          filters:
            - RewritePath=/v3/api-docs/delivery, /v3/api-docs

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - AddRequestHeader=X-Gateway-Key, ${GATEWAY_SHARED_KEY:change-me-order-key}

        - id: order-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/order
          filters:
            - RewritePath=/v3/api-docs/order, /v3/api-docs

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=0

        - id: product-docs
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/product
          filters:
            - RewritePath=/v3/api-docs/product, /v3/api-docs

        - id: supermarket-service
          uri: ${SUPERMARKET_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/supermarkets/**
          filters:
            - StripPrefix=0

        - id: supermarket-docs
          uri: ${SUPERMARKET_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/v3/api-docs/supermarket
          filters:
            - RewritePath=/v3/api-docs/supermarket, /v3/api-docs

        # - id: payment-service
        #   uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
        #   predicates:
        #     - Path=/api/payments/**
        #   filters:
        #     - StripPrefix=0

        # - id: payment-docs
        #   uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
        #   predicates:
        #     - Path=/v3/api-docs/payment
        #   filters:
        #     - RewritePath=/v3/api-docs/payment, /v3/api-docs

        - id: promotion-service
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/promotions/**
          filters:
            - StripPrefix=0

        - id: promotion-docs
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/promotion
          filters:
            - RewritePath=/v3/api-docs/promotion, /v3/api-docs

        - id: review-service
          uri: ${REVIEW_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=0

#        - id: supermarket-service
#          uri: ${SUPERMARKET_SERVICE_URL:http://localhost:8087}
#          predicates:
#            - Path=/api/supermarket/**
#          filters:
#            - StripPrefix=0
        - id: review-docs
          uri: ${REVIEW_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/review
          filters:
            - RewritePath=/v3/api-docs/review, /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, routes
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

# Swagger aggregation
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Delivery Service
        url: /v3/api-docs/delivery
      - name: Order Service
        url: /v3/api-docs/order
      - name: Product Service
        url: /v3/api-docs/product
      - name: Promotion Service
        url: /v3/api-docs/promotion
      - name: Review Service
        url: /v3/api-docs/review
      - name: Supermarket Service
        url: /v3/api-docs/supermarket
      - name: Payment Service
        url: /v3/api-docs/payment
